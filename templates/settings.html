{% extends "base.html" %}
{% block title %}Налаштування{% endblock %}

{% block content %}
<div class="container py-4">
  <h3 class="mb-4">🔧 Налаштування</h3>
  <form id="config-form">
    <div class="mb-3">
      <label for="channels" class="form-label">Канали (формат: id: опис)</label>
      <textarea class="form-control" id="channels" rows="5" required></textarea>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="days_to_keep" class="form-label">Днів зберігання новин</label>
        <input type="number" class="form-control" id="days_to_keep" required />
      </div>
      <div class="col-md-4 mb-3">
        <label for="MAX_FILE_SIZE_MB" class="form-label">Макс. розмір файлу (MB)</label>
        <input type="number" class="form-control" id="MAX_FILE_SIZE_MB" required />
      </div>
      <div class="col-md-4 mb-3">
        <label for="news_update_in_minutes" class="form-label">Інтервал оновлення новин (хв)</label>
        <input type="number" class="form-control" id="news_update_in_minutes" required />
      </div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button type="submit" class="btn btn-success">📅 Зберегти налаштування</button>
      <button type="button" id="restart-btn" class="btn btn-danger"> 🔄 Перезапуск програми </button>
      <a href="/" class="btn btn-secondary">← Назад</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/settings.js"></script>
{% endblock %}
