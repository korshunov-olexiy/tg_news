<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasExampleLabel" style="margin: 0">
      <img src="/static/icons/news-title.jpg" alt="Новини" height="24" /> Новини
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div class="d-flex gap-2 justify-content-between mb-3">
      <button class="btn btn-danger w-50" onclick="if(confirm('Очистити все?')) fetch('/admin/cleanup', {method: 'POST'}).then(()=>location.reload())">
        🧹 Очистити
      </button>
      <button class="btn btn-warning w-50" onclick="location.href='/settings'">⚙️ Налаштування</button>
    </div>
    <div class="d-flex align-items-center justify-content-between my-2 gap-2" style="flex-wrap: wrap">
      <button id="theme-toggle" class="btn btn-outline-secondary flex-shrink-0" title="Перемкнути тему">🌙</button>
      <div id="currency-rates" class="rates-box text-end small text-muted" style="font-family: monospace; white-space: nowrap">
        Завантаження...
      </div>
    </div>
    <div class="mt-3 w-100" id="exchange-chart-container">
      <h6 class="mb-2 text-center">Графік курсів валют</h6>
      <div class="chart-wrapper">
        <canvas id="exchange-chart"></canvas>
      </div>
    </div>
    <h5 class="mt-2">Канали</h5>
    <ul class="list-group">
      {% for ch, title, count in channel_list %}
        <a href="/?channel={{ ch }}" class="list-group-item {% if ch == selected_channel %}active{% endif %}">
          {{ title }} <span class="badge bg-secondary">{{ count }}</span>
          <span style="display: block; font-size: 0.65em; font-style: italic; margin-left: 5px;">@{{ ch }}</span>
        </a>
      {% endfor %}
    </ul>
  </div>
</div>
